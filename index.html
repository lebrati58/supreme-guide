<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Supreme Guide — Every Journey Is a Game!</title>
    <meta name="description" content="The global travel quiz game. Turn every flight, train, bus, road trip, walk or cruise into an adventure — works offline." />
    <meta name="theme-color" content="#0b1f4d" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Supreme Guide" />
    <meta property="og:title" content="Supreme Guide — The Global Travel Quiz Game" />
    <meta property="og:description" content="Every Journey Is a Game!" />
    <meta property="og:image" content="https://lebrati58.github.io/supreme-guide/brand/og-1200x630.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="brand/logo-640.webp" />
    <style>
      /* Inline boot splash: visible before JS loads (also offline). */
      html,body{margin:0;background:#0b1f4d;height:100%}
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2a63d4 0%,#123a8a 45%,#0b1f4d 100%);z-index:9999;transition:opacity .4s}
      #boot img{width:min(62vw,340px);border-radius:50%;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));animation:bootpulse 1.6s ease-in-out infinite}
      #boot p{font:700 16px system-ui,sans-serif;color:#ffd36b;text-align:center;margin-top:18px;letter-spacing:.04em}
      @keyframes bootpulse{50%{transform:scale(1.04) rotate(-1deg)}}
      @media (prefers-reduced-motion:reduce){#boot img{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div><img src="brand/logo-640.webp" alt="" width="340" height="340" /><p>Packing your suitcase…</p></div></div>
    <div id="root"></div>
    <noscript><p style="color:#fff;font-family:system-ui;padding:24px">Supreme Guide needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
