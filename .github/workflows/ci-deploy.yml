name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Translation catalogs (10 languages)
        run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx -y playwright@1.49.1 install --with-deps chromium && npm i --no-save playwright@1.49.1
      - name: End-to-end + airplane-mode test
        run: |
          npx vite preview --port 4173 --strictPort &
          npx -y wait-on@8 http://localhost:4173/supreme-guide/
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
